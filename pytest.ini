[pytest]
testpaths = tests
pythonpath = backend ml
filterwarnings =
    ignore::DeprecationWarning
# The Gemini client logs a full quota payload on every 429. On the free tier
# that is most of a test run, and it buries the actual assertion failures.
log_cli = false
log_level = WARNING

markers =
    integration: exercises the full API through TestClient against the seeded catalog
