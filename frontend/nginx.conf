server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: /plan/{id}/discover is a React route, not a file.
    # Without this, a refresh on any deep link returns 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deployed build keeps serving the
    # previous bundle's asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
