# Render blueprint for the backend. Frontend goes to Vercel (vercel.json).
#
# Secrets are declared with `sync: false`, which means Render prompts for them
# in the dashboard and never stores them in this file. Nothing here is a
# credential -- committing this is safe, which is the point.

services:
  - type: web
    name: smartbuy-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # Repo root, not ./backend. The app resolves two paths *above* the backend
    # directory -- the seed catalog (data/products/catalog.json) and the
    # personalisation model (ml/personalization/model/) -- so a backend-only
    # context builds an image whose seeder crashes on boot and whose model
    # never loads. See the COPY block in backend/Dockerfile.
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        # Neon connection string, or point at the render Postgres below.
        # Must use the psycopg driver: postgresql+psycopg://...
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: CORS_ORIGINS
        # The deployed frontend origin. A wrong value here fails at runtime in
        # the browser only, which is the slowest possible way to find out.
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
